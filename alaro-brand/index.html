<title>Alaro Home Brand</title>
<style>
  /* Layout: one full-screen frame holding the branded site export (site/index.html). Single teal look. */
  :root {
    --ground: #063a33;
    --ink: #eef6f2;
    --muted: #8fb8aa;
    color-scheme: dark;
  }
  html,
  body {
    height: 100%;
  }
  body {
    background: var(--ground);
    color: var(--ink);
    overflow: hidden;
  }
  .site {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: var(--ground);
  }
  .hint {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding-inline: 16px;
    font: 400 15px/1.4 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: var(--muted);
    pointer-events: none;
  }
</style>
<p class="hint">Opening the Alaro site…</p>
<iframe class="site" src="site/index.html" title="Alaro website in the brand design language, with the 3D home hero" allow="autoplay; fullscreen"></iframe>
