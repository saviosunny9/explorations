<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Savio’s editor</title>
  <meta name="description" content="A layered photo & graphic editor for scrapbook-style posts: text styles, stickers, frames, calendars, templates and snap-to-grid layout." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="studio.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="menu-btn" id="btn-menu" title="Menu"><span class="brand-mark"></span><span class="brand-name">Savio’s editor</span><i data-icon="chevDown"></i></button>
      <input id="doc-name" class="doc-name" value="Untitled design" spellcheck="false" aria-label="Design name" />
      <span class="size-chip" id="size-label" title="Canvas size">1080 × 1350</span>
      <button class="save-chip" id="save-state" type="button" hidden>Draft</button>
      <div class="tb-spacer"></div>
      <div class="tb-center">
  <div class="zoom-ctl" id="zoom-ctl">
        <button class="z-btn" id="btn-view" title="Grid & snapping"><i data-icon="grid"></i></button>
        <span class="z-sep"></span>
        <button class="z-btn" id="btn-zoom-out" title="Zoom out (⌘−)"><i data-icon="minus"></i></button>
        <button class="z-val" id="btn-zoom-fit" title="Zoom options">100%</button>
        <button class="z-btn" id="btn-zoom-in" title="Zoom in (⌘+)"><i data-icon="plus"></i></button>
      </div>
        <span class="z-sep"></span>
  <div class="tb-group">
        <button class="tb-icon" id="btn-undo" title="Undo (⌘Z)"><i data-icon="undo"></i></button>
        <button class="tb-icon" id="btn-redo" title="Redo (⇧⌘Z)"><i data-icon="redo"></i></button>
      </div>
      </div>

      <button class="tb-btn" id="btn-animate" title="Animate (P to play)"><i data-icon="film"></i><span>Animate</span></button>
      <button class="tb-btn primary" id="btn-export" title="Export (⌘E)"><i data-icon="download"></i><span>Export</span></button>
    </header>

    <nav class="rail" id="rail">
      <button data-tab="styles" class="active"><i data-icon="sparkle"></i><span>Styles</span></button>
      <button data-tab="templates"><i data-icon="layout"></i><span>Templates</span></button>
      <button data-tab="elements"><i data-icon="shapes"></i><span>Elements</span></button>
      <button data-tab="text"><i data-icon="type"></i><span>Text</span></button>
      <button data-tab="photos"><i data-icon="image"></i><span>Photos</span></button>
      <button data-tab="sounds"><i data-icon="music"></i><span>Sounds</span></button>
      <button data-tab="background"><i data-icon="palette"></i><span>Canvas</span></button>
      <div class="rail-spacer"></div>
      <button data-tab="layers"><i data-icon="layers"></i><span>Layers</span></button>
    </nav>

    <aside class="panel" id="panel"></aside>

    <main class="stage-area" id="stage-area">
      <div id="stage"></div>
      <div id="overlay-layer"></div>
      <div class="stage-hint" id="stage-hint"></div>
      <div class="float-bar" id="eraser-bar" hidden></div>
      <div class="timeline" id="timeline" hidden></div>
      <div class="dock" id="dock"></div>

      <div class="drop-veil" id="drop-veil"><div>Drop photos to add them</div></div>
    </main>

    <aside class="inspector" id="inspector"></aside>
  </div>

  <div id="home" class="home" hidden></div>
  <div id="popover-root"></div>
  <div id="modal-root"></div>
  <div class="toast" id="toast"></div>
  <input type="file" id="file-input" accept="image/*,video/*,audio/*" multiple hidden />
  <input type="file" id="project-input" accept=".json,.zip,application/json,application/zip" hidden />

  <script src="https://cdn.jsdelivr.net/npm/konva@9.3.22/konva.min.js"></script>
  <script src="fonts.js"></script>
  <script src="stickers.js"></script>
  <script src="outfits-girls.js"></script>
  <script src="outfits-boys.js"></script>
  <script src="stickers-game.js"></script>
  <script src="papers.js"></script>
  <script src="render.js"></script>
  <script src="styles.js"></script>
  <script src="captions.js"></script>
  <script src="nature.js"></script>
  <script src="flashes.js"></script>
  <script src="filmphotos.js"></script>
  <script src="portraits.js"></script>
  <script src="vox.js"></script>
  <script src="templates.js"></script>
  <script src="soundpack.js"></script>
  <script src="sfx.js"></script>
  <script src="app.js"></script>
  <script src="audio.js"></script>
  <script src="clips.js"></script>
  <script src="bgremove.js"></script>
  <script src="video.js"></script>
  <script src="tracker.js"></script>
  <script src="camtrack.js"></script>
  <script src="subject.js"></script>
  <script src="align-model.js"></script>
  <script src="captions-asr.js"></script>
  <script src="ui.js"></script>
  <script src="styles-ui.js"></script>
  <script src="timeline.js"></script>
  <script src="sounds-ui.js"></script>
  <script src="captions-ui.js"></script>
  <script src="clones.js"></script>
  <script src="masks.js"></script>
</body>
</html>
