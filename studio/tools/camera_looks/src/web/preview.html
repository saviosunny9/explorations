<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera Looks</title>
<style>
  :root { --bg: #0b0b0c; --panel: #151517; --line: rgba(255,255,255,.12); --text: #f2f2f2; --dim: #9a9aa0; --accent: #fff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { display: flex; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header b { margin-right: auto; font-weight: 600; }
  button, select, label.btn { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font: inherit; cursor: pointer; }
  button.on { background: var(--accent); color: #000; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; min-height: calc(100vh - 58px); }
  .stage { display: grid; place-items: center; padding: 16px; min-width: 0; }
  canvas#out { max-width: 100%; max-height: calc(100vh - 220px); border-radius: 10px; background: #000; }
  .shelves { display: flex; gap: 6px; padding: 0 16px; flex-wrap: wrap; }
  .looks { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; }
  .looks button { flex: none; }
  aside { border-left: 1px solid var(--line); padding: 12px 16px; overflow-y: auto; max-height: calc(100vh - 58px); }
  aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 16px 0 6px; }
  .row { display: grid; grid-template-columns: 1fr 44px; gap: 4px 8px; align-items: center; margin: 6px 0; }
  .row span { color: var(--dim); font-size: 12px; } .row input[type=range] { grid-column: 1 / -1; width: 100%; }
  .row output { text-align: right; font-variant-numeric: tabular-nums; }
  textarea { width: 100%; height: 120px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; font: 12px ui-monospace, monospace; }
  .hint { color: var(--dim); font-size: 12px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } aside { border-left: 0; border-top: 1px solid var(--line); max-height: none; } canvas#out { max-height: 60vh; } }
</style>
</head>
<body>
<header>
  <b>Camera Looks</b>
  <button id="cam">Camera</button>
  <button id="flip" title="Switch front / back camera">Flip</button>
  <label class="btn">Photo or video<input id="file" type="file" accept="image/*,video/*" hidden></label>
  <button id="sample">Sample photo</button>
  <button id="snap">Save picture</button>
</header>
<main>
  <div>
    <div class="stage"><canvas id="out"></canvas></div>
    <div class="shelves" id="shelves"></div>
    <div class="looks" id="looks"></div>
  </div>
  <aside>
    <p class="hint">Every look is a set of the parameters below (see looks.json and spec/PIPELINE.md). Move a slider to make your own; the JSON underneath is what a look is.</p>
    <div id="params"></div>
    <h3>This look as JSON</h3>
    <textarea id="json" spellcheck="false"></textarea>
  </aside>
</main>
<script src="../reference/looks-reference.js"></script>
<script src="webgl-looks.js"></script>
<script>
  const L = CameraLooks, out = document.getElementById('out'), fx = new LookRenderer(out, { preserve: true });
  let source = null, shelf = L.SHELVES[0].id, lookId = L.SHELVES[0].looks[0], params = {}, facing = 'environment', stream = null;
  const PARAMS = /*PARAMS*/[]/*END*/;
  const SAMPLE = '/*SAMPLE*/';
  function setLook(id) { lookId = id; params = JSON.parse(JSON.stringify(L.LOOKS[id].params)); drawLooks(); drawParams(); }
  function drawShelves() {
    const el = document.getElementById('shelves'); el.replaceChildren();
    for (const s of L.SHELVES) { const b = document.createElement('button'); b.textContent = s.name; b.className = s.id === shelf ? 'on' : ''; b.onclick = () => { shelf = s.id; drawShelves(); drawLooks(); }; el.append(b); }
  }
  function drawLooks() {
    const el = document.getElementById('looks'); el.replaceChildren();
    for (const id of L.SHELVES.find(s => s.id === shelf).looks) { const b = document.createElement('button'); b.textContent = L.LOOKS[id].name; b.className = id === lookId ? 'on' : ''; b.onclick = () => setLook(id); el.append(b); }
  }
  function drawParams() {
    const el = document.getElementById('params'); el.replaceChildren();
    let group = '';
    for (const p of PARAMS) {
      if (p.type !== 'number') continue;
      if (p.group !== group) { group = p.group; const h = document.createElement('h3'); h.textContent = group; el.append(h); }
      const row = document.createElement('div'); row.className = 'row';
      const name = document.createElement('span'); name.textContent = p.label;
      const val = document.createElement('output');
      const r = document.createElement('input'); r.type = 'range'; r.min = p.min; r.max = p.max; r.step = p.step || 1; r.value = params[p.key] ?? p.default ?? 0;
      val.textContent = r.value;
      r.oninput = () => { const v = +r.value; if (v === (p.default ?? 0)) delete params[p.key]; else params[p.key] = v; val.textContent = v; showJson(); };
      row.append(name, val, r); el.append(row);
    }
    showJson();
  }
  function showJson() { document.getElementById('json').value = JSON.stringify(params, null, 1); }
  document.getElementById('json').oninput = e => { try { params = JSON.parse(e.target.value); } catch (err) { /* still typing */ } };
  function useVideo(v) { source = v; v.play().catch(() => {}); }
  async function camera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
      const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.srcObject = stream; useVideo(v);
    } catch (e) { alert('No camera here (' + e.message + '). Try a photo or video instead.'); }
  }
  document.getElementById('cam').onclick = camera;
  document.getElementById('flip').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; camera(); };
  document.getElementById('file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const url = URL.createObjectURL(f);
    if (f.type.startsWith('video')) { const v = document.createElement('video'); v.muted = true; v.loop = true; v.playsInline = true; v.src = url; useVideo(v); }
    else { const i = new Image(); i.onload = () => { source = i; }; i.src = url; }
  };
  document.getElementById('sample').onclick = () => { const i = new Image(); i.onload = () => { source = i; }; i.src = SAMPLE; };
  document.getElementById('snap').onclick = () => { const a = document.createElement('a'); a.download = lookId + '.jpg'; a.href = out.toDataURL('image/jpeg', 0.92); a.click(); };
  const t0 = performance.now();
  (function loop() {
    if (source && (source.readyState === undefined || source.readyState >= 2)) fx.render(source, params, { time: (performance.now() - t0) / 1000, width: Math.min(1280, source.videoWidth || source.naturalWidth || source.width) });
    requestAnimationFrame(loop);
  })();
  drawShelves(); setLook(lookId);
  document.getElementById('sample').click();
</script>
</body>
</html>
